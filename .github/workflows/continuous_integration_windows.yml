name: Continuous Integration - Windows

on:
  push:
    branches: [master, 'sol/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Visual Studio ${{ matrix.platform }} ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
        platform: [x64, x86]
    steps:
      - uses: actions/checkout@v6
      - name: Build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & "$vswhere" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }
          $options = @(
            '-property:Configuration=${{ matrix.configuration }}',
            '-property:Platform=${{ matrix.platform }}',
            '-maxcpucount',
            '-verbosity:minimal'
          )

          $builderOutput = & $msbuild Builder.sln -restore $options 2>&1
          $builderStatus = $LASTEXITCODE
          $builderOutput | Tee-Object -FilePath builder-build.log
          if ($builderStatus -ne 0) {
            $details = ($builderOutput | Select-Object -Last 100 | Out-String).Trim()
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Builder build failed::$details"
            exit $builderStatus
          }

          $updaterOutput = & $msbuild Source\Tools\Updater\Updater.csproj $options 2>&1
          $updaterStatus = $LASTEXITCODE
          $updaterOutput | Tee-Object -FilePath updater-build.log
          if ($updaterStatus -ne 0) {
            $details = ($updaterOutput | Select-Object -Last 100 | Out-String).Trim()
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Updater build failed::$details"
            exit $updaterStatus
          }
      - name: Verify outputs
        shell: pwsh
        run: |
          @(
            'Build\Builder.exe',
            'Build\BuilderNative.dll',
            'Build\Plugins\BuilderModes.dll',
            'Build\Updater.exe'
          ) | ForEach-Object {
            if (-not (Test-Path $_ -PathType Leaf)) { throw "Missing output: $_" }
          }
      - name: Prepare package
        shell: pwsh
        run: if (Test-Path Build\Setup) { Remove-Item Build\Setup -Recurse -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: sol-editor-vs-${{ matrix.platform }}-${{ matrix.configuration }}
          path: Build
          if-no-files-found: error
