name: Continuous Integration - Other

on:
  push:
    branches: [master, 'sol/**']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Mono and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg mesa-common-dev libx11-dev libxfixes-dev
          sudo gpg --homedir /tmp --no-default-keyring \
            --keyring gnupg-ring:/usr/share/keyrings/mono-official-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          sudo chmod +r /usr/share/keyrings/mono-official-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/ubuntu stable-focal main' | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt-get update
          sudo apt-get install -y mono-complete
          msbuild -version
      - name: Build Linux editor
        shell: bash
        run: |
          set +e
          make linux 2>&1 | tee build-linux.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            details=$(tail -n 80 build-linux.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            printf '::error title=Linux editor build failed::%s\n' "$details"
            exit "$status"
          fi
      - name: Verify outputs
        run: |
          test -f Build/Builder.exe
          test -f Build/libBuilderNative.so
          test -f Build/Plugins/BuilderModes.dll
      - uses: actions/upload-artifact@v4
        with:
          name: sol-editor-linux
          path: Build
          if-no-files-found: error
