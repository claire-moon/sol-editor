name: SOL! editor v0.4 compatibility

on:
  push:
    branches: [master, 'sol/**']
    paths:
      - 'sol/**'
      - 'sol-project/**'
      - 'tools/sol-*'
      - 'tests/**'
      - 'docs/sol/**'
      - 'branding/sol/**'
      - 'Source/Core/Config/ConfigurationInfo.cs'
      - 'Source/Core/Resources/UDB2.ico'
      - 'SOL.md'
      - 'ROADMAP.md'
      - 'THIRD_PARTY.md'
      - '.gitignore'
      - '.github/workflows/sol-foundation.yml'
  pull_request:
    paths:
      - 'sol/**'
      - 'sol-project/**'
      - 'tools/sol-*'
      - 'tests/**'
      - 'docs/sol/**'
      - 'branding/sol/**'
      - 'Source/Core/Config/ConfigurationInfo.cs'
      - 'Source/Core/Resources/UDB2.ico'
      - 'SOL.md'
      - 'ROADMAP.md'
      - 'THIRD_PARTY.md'
      - '.gitignore'
      - '.github/workflows/sol-foundation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: claire-moon/sol-engine
          ref: sol/v0.4.0-bundle-authority
          path: sol-engine
      - name: Validate metadata and scripts
        run: |
          python3 -m json.tool sol/version.json >/dev/null
          python3 -m json.tool sol-project/project.json >/dev/null
          python3 -m json.tool sol-project/wadpack.json >/dev/null
          python3 -m json.tool sol-project/story/story.json >/dev/null
          bash -n tools/sol-*.sh tests/test-sol-*.sh
          python3 -m py_compile \
            tools/sol-bundle.py \
            tools/sol-generate-e1m1.py \
            tools/sol-validate-e1m1.py \
            tools/sol-wadpack.py \
            tools/sol-story.py
      - name: Validate v0.4 compatibility contract
        run: |
          python3 - <<'PY'
          import json
          version = json.load(open('sol/version.json', encoding='utf-8'))
          project = json.load(open('sol-project/project.json', encoding='utf-8'))
          pointer = json.load(open('sol-project/wadpack.json', encoding='utf-8'))
          story = json.load(open('sol-project/story/story.json', encoding='utf-8'))
          engine = json.load(open('sol-engine/sol/version.json', encoding='utf-8'))
          manifest = json.load(open('sol-engine/sol/wadpack.json', encoding='utf-8'))
          assert version['project'] == 'SOL! Editor'
          assert version['version'] == '0.4.0'
          assert version['bundle_version'] == '0.4.0'
          assert version['engine_contract'] == '0.4.0'
          assert version['authoring_contract'] == '0.2.0'
          assert version['geometry_contract'] == 1
          assert version['map_title'] == 'TESTMAP'
          assert version['wadpack_contract'] == 3
          assert version['wadpack_entries'] == 18
          assert version['wadpack_slots'] == 20
          assert version['bundle_contract'] == 2
          assert version['runtime_slot'] == 21
          assert version['content_slot'] == 22
          assert version['soldefaults_contract'] == 1
          assert project['name'] == 'SOL!'
          assert project['version'] == '0.4.0'
          assert project['map_title'] == 'TESTMAP'
          assert project['engine_package'] == 'sol-e1m1-v0.4.0.pk3'
          assert project['testbed_contract'] == 1
          assert project['geometry_contract'] == 1
          assert project['monster_profile'] == 'none'
          assert project['linked_portals'] == 2
          assert project['bundle_contract'] == 2
          assert project['wadpack_contract'] == 3
          assert pointer['deprecated'] is True
          assert pointer['authority'] == 'sol-engine/sol/wadpack.json'
          assert story['contract'] == 1
          assert engine['project'] == 'SOL! Engine'
          assert engine['version'] == version['engine_contract']
          assert engine['geometry_contract'] == version['geometry_contract']
          assert engine['bundle_contract'] == version['bundle_contract']
          assert engine['wadpack_contract'] == version['wadpack_contract']
          assert manifest['slots'][10]['state'] == 'retired'
          assert manifest['slots'][18]['id'] == 'precise-crosshair'
          assert manifest['slots'][19]['state'] == 'reserved'
          PY
          python3 tools/sol-story.py sol-project/story/story.json --summary
      - name: Verify engine authority
        env:
          SOL_ENGINE_ROOT: ${{ github.workspace }}/sol-engine
        run: |
          grep -F 'SOL Engine v0.4 bundler not found' tools/sol-bundle.sh
          grep -F 'SOL Engine v0.4 bundle tool not found' tools/sol-bundle.py
          grep -F 'SOL Engine v0.4 wadpack tool not found' tools/sol-wadpack.py
          grep -F 'SOL Engine v0.4 wadpack setup not found' tools/sol-wadpack-setup.sh
          grep -F '"$engine_root/sol/wadpack.json"' tools/sol-test-main.sh
          grep -F '"$engine_root/sol/wadpack.json"' tools/sol-editor-engine.sh
          grep -F '"$engine_root/sol/wadpack.json"' tools/sol-open-editor-main.sh
          bash sol-engine/tests/test-sol-bundle-v04.sh
      - name: Run SOL! editor regression suite
        run: |
          for test_script in tests/test-sol-*.sh; do
            printf '== %s ==\n' "$test_script"
            bash "$test_script"
          done
      - name: Verify generated TESTMAP systems testbed
        run: |
          mkdir -p build/sol/generated/e1m1
          python3 tools/sol-generate-e1m1.py --output build/sol/generated/e1m1
          python3 tools/sol-validate-e1m1.py --directory build/sol/generated/e1m1
          cmp build/sol/generated/e1m1/stats.json sol-project/maps/e1m1/stats.json
          cmp build/sol/generated/e1m1/layout.svg sol-project/maps/e1m1/layout.svg
          python3 - <<'PY'
          import json
          stats = json.load(open('sol-project/maps/e1m1/stats.json'))
          assert stats['title'] == 'TESTMAP'
          assert stats['geometry_contract'] == 1
          assert stats['rooms'] == 10
          assert stats['sectors'] == 36
          assert stats['monsters'] == 0
          assert stats['linked_portals'] == 2
          assert stats['decorations'] == 108
          assert stats['weapons'] == 6
          PY
      - name: Verify pinned DoomTools revision
        run: bash tools/sol-bootstrap-doomtools.sh --verify-only
      - name: Build v0.4 testbed content component
        env:
          SOL_SKIP_DOOMTOOLS: '1'
        run: bash tools/sol-build.sh
      - name: Inspect content component
        run: |
          archive=$(find build/sol -maxdepth 1 -name 'sol-e1m1-v0.4.0.pk3' -print -quit)
          test -n "$archive"
          unzip -t "$archive"
          unzip -Z1 "$archive" | grep -Fx SOLINFO
          unzip -Z1 "$archive" | grep -Fx SOLSTORY.json
          unzip -Z1 "$archive" | grep -Fx maps/E1M1.wad
          unzip -p "$archive" SOLINFO | grep -F 'Map: E1M1 — TESTMAP'
          unzip -p "$archive" SOLINFO | grep -F 'Monsters: none'
          unzip -p "$archive" SOLINFO | grep -F 'geometry contract 1'
          unzip -p "$archive" SOLINFO | grep -F 'Wadpack contract: 3'
          unzip -p "$archive" SOLSTORY.json | python3 -m json.tool >/dev/null
          test -s branding/sol/sol-icon-master.png
          test -s Source/Core/Resources/UDB2.ico
