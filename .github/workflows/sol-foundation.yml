name: SOL story authoring foundation

on:
  push:
    branches: [master, 'sol/**']
    paths:
      - 'sol/**'
      - 'sol-project/**'
      - 'tools/sol-*'
      - 'tests/**'
      - 'docs/sol/**'
      - 'branding/sol/**'
      - 'Source/Core/Config/ConfigurationInfo.cs'
      - 'Source/Core/Resources/UDB2.ico'
      - 'SOL.md'
      - 'ROADMAP.md'
      - 'THIRD_PARTY.md'
      - '.gitignore'
      - '.github/workflows/sol-foundation.yml'
  pull_request:
    paths:
      - 'sol/**'
      - 'sol-project/**'
      - 'tools/sol-*'
      - 'tests/**'
      - 'docs/sol/**'
      - 'branding/sol/**'
      - 'Source/Core/Config/ConfigurationInfo.cs'
      - 'Source/Core/Resources/UDB2.ico'
      - 'SOL.md'
      - 'ROADMAP.md'
      - 'THIRD_PARTY.md'
      - '.gitignore'
      - '.github/workflows/sol-foundation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install archive test dependency
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Validate metadata and scripts
        run: |
          python3 -m json.tool sol/version.json >/dev/null
          python3 -m json.tool sol-project/project.json >/dev/null
          python3 -m json.tool sol-project/wadpack.json >/dev/null
          python3 -m json.tool sol-project/story/story.json >/dev/null
          bash -n tools/sol-*.sh tests/*.sh
          python3 -m py_compile \
            tools/sol-generate-e1m1.py \
            tools/sol-validate-e1m1.py \
            tools/sol-wadpack.py \
            tools/sol-bundle.py \
            tools/sol-story.py
      - name: Validate release contract
        run: |
          python3 - <<'PY'
          import json
          with open('sol/version.json', encoding='utf-8') as f:
              version = json.load(f)
          with open('sol-project/project.json', encoding='utf-8') as f:
              project = json.load(f)
          with open('sol-project/wadpack.json', encoding='utf-8') as f:
              wadpack = json.load(f)
          with open('sol-project/story/story.json', encoding='utf-8') as f:
              story = json.load(f)
          assert version['version'] == '0.2.0'
          assert version['bundle_version'] == '0.3.0'
          assert version['engine_contract'] == '0.2.0'
          assert version['wadpack_contract'] == 2
          assert version['wadpack_entries'] == 18
          assert version['bundle_contract'] == 1
          assert version['bundle_name'] == 'sol.pk3'
          assert version['story_contract'] == 1
          assert project['version'] == '0.2.0'
          assert project['engine_package'] == 'sol-e1m1-v0.2.0.pk3'
          assert project['wadpack_contract'] == 2
          assert project['bundle_contract'] == 1
          assert project['runtime_bundle'] == 'sol.pk3'
          assert project['story_contract'] == 1
          assert project['story_manifest'] == 'sol-project/story/story.json'
          assert story['contract'] == 1
          assert story['map'] == project['map']
          assert wadpack['version'] == '0.1.0'
          assert len(wadpack['load_order']) == 18
          tail = wadpack['load_order'][-4:]
          assert [item['id'] for item in tail] == [
              'universal-ambience',
              'cosmoambience-script-edited',
              'ambient-decorations',
              'targetspy',
          ]
          assert [item['runtime_name'] for item in tail] == [
              '15-universal-ambience.pk3',
              '16-cosmoambience-script-edited.pk3',
              '17-ambient-decorations.pk3',
              '18-targetspy-v3.1.0.pk3',
          ]
          PY
          python3 tools/sol-story.py sol-project/story/story.json --summary
          test -s THIRD_PARTY.md
          grep -F 'local-build runtime artifact' THIRD_PARTY.md
      - name: Verify setup, cockpit, wadpack, bundle, story, and launchers
        run: |
          for test_script in tests/test-sol-*.sh; do
            bash "$test_script"
          done
      - name: Verify generated map
        run: |
          mkdir -p build/sol/generated/e1m1
          python3 tools/sol-generate-e1m1.py --output build/sol/generated/e1m1
          python3 tools/sol-validate-e1m1.py --directory build/sol/generated/e1m1
          cmp build/sol/generated/e1m1/stats.json sol-project/maps/e1m1/stats.json
          cmp build/sol/generated/e1m1/layout.svg sol-project/maps/e1m1/layout.svg
          ! grep -R -F 'Transition Seam' tools/sol-generate-e1m1.py sol-project/maps/e1m1/layout.svg
      - name: Verify pinned DoomTools revision
        run: bash tools/sol-bootstrap-doomtools.sh --verify-only
      - name: Build story foundation component package
        env:
          SOL_SKIP_DOOMTOOLS: '1'
        run: bash tools/sol-build.sh
      - name: Inspect component package and branding
        run: |
          archive=$(find build/sol -maxdepth 1 -name 'sol-e1m1-v0.2.0.pk3' -print -quit)
          test -n "$archive"
          unzip -t "$archive"
          unzip -Z1 "$archive" | grep -Fx SOLINFO
          unzip -Z1 "$archive" | grep -Fx SOLSTORY.json
          unzip -Z1 "$archive" | grep -Fx maps/E1M1.wad
          unzip -p "$archive" SOLINFO | grep -F '18 locked resources'
          unzip -p "$archive" SOLSTORY.json | python3 -m json.tool >/dev/null
          test -s branding/sol/sol-icon-master.png
          test -s Source/Core/Resources/UDB2.ico
